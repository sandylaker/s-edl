_base_: ['../baseline/baseline_formulareasoning_ministral3-8b.yaml']

training:
  _delete_: true
  max_steps: 512
  per_device_train_batch_size: 4
  num_generations: 8
  gradient_accumulation_steps: 2
  learning_rate: 0.00001
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  logging_steps: 1
  save_strategy: 'no'
  bf16: true
  gradient_checkpointing: true
  optim: adamw_torch
  use_vllm: true
  vllm_mode: server
  max_completion_length: 2048
  mask_truncated_completions: true
  temperature: 1.0
  top_p: 0.9
  loss_type: dr_grpo
  scale_rewards: group

reward_type: llm_judge

judge_engine:
  cuda_devices: "1"
  gpu_memory_utilization: 0.4
